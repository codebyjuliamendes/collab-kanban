<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collab Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-slate-800/60 backdrop-blur-md border border-white/10;
            }
            .glass-header {
                @apply bg-slate-900/80 backdrop-blur-lg border-b border-white/10;
            }
            .text-gradient {
                @apply bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent;
            }
            
            /* Drag and Drop Specific Styles */
            .is-dragging {
                @apply opacity-80 shadow-2xl scale-105 rotate-2 cursor-grabbing z-50;
            }
            .drop-indicator {
                @apply h-1 bg-indigo-500 rounded-full my-1 transition-transform duration-200;
            }
            
            /* Scrollbar styling */
            ::-webkit-scrollbar {
                @apply w-2 h-2;
            }
            ::-webkit-scrollbar-track {
                @apply bg-transparent;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-slate-600 rounded-full;
            }
            ::-webkit-scrollbar-thumb:hover {
                @apply bg-slate-500;
            }
        }

        body {
            @apply bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden font-sans;
            background-image: radial-gradient(circle at top right, #312e81 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #0f172a 0%, transparent 40%);
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="app-header glass-header flex justify-between items-center px-6 py-4 z-10 relative shadow-md">
        <div class="logo text-2xl font-bold text-gradient tracking-tight">KanbanSync</div>
        <div class="header-right flex items-center gap-4">
            <div id="connection-status" class="status-badge px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-red-500/20 text-red-400">Offline</div>
            <div id="presence-avatars" class="presence-container flex -space-x-2"></div>
            <button id="add-column-btn" class="btn primary px-4 py-2 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-500/20 active:scale-95 flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Column
            </button>
        </div>
    </header>
    
    <main class="board-container flex-1 overflow-x-auto overflow-y-hidden p-6 relative z-0">
        <div id="board" class="board flex gap-6 h-full items-start">
            <div id="skeleton-loader" class="flex gap-6 w-full animate-pulse">
                <div class="glass-panel rounded-xl w-80 h-96"></div>
                <div class="glass-panel rounded-xl w-80 h-64"></div>
                <div class="glass-panel rounded-xl w-80 h-80"></div>
            </div>
        </div>
    </main>

    <!-- Templates -->
    <template id="column-template">
        <div class="column glass-panel rounded-xl w-80 min-w-[20rem] max-h-full flex flex-col shadow-xl" data-id="">
            <div class="column-header p-4 flex justify-between items-center border-b border-white/5 cursor-grab active:cursor-grabbing group">
                <input class="column-title bg-transparent border-none text-slate-100 text-base font-semibold outline-none w-full placeholder-slate-400 focus:ring-0" type="text" value="New Column">
                <button class="add-card-btn text-slate-400 hover:text-indigo-400 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100 flex items-center justify-center p-1 rounded hover:bg-white/5">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="card-list p-3 overflow-y-auto flex-1 min-h-[50px] space-y-3"></div>
        </div>
    </template>

    <template id="card-template">
        <div class="card bg-slate-700/80 hover:bg-slate-700 border border-slate-600/50 hover:border-indigo-500/50 rounded-lg p-4 cursor-grab active:cursor-grabbing transition-all duration-200 hover:shadow-lg select-none touch-none" data-id="">
            <div class="card-labels flex gap-2 mb-2 flex-wrap empty:hidden"></div>
            <div class="card-title text-sm font-medium text-slate-200 outline-none focus:ring-1 focus:ring-indigo-500 rounded px-1 -mx-1 py-0.5"></div>
            <div class="card-footer flex justify-between items-center mt-3 empty:hidden">
                <div class="card-badges flex gap-2"></div>
                <div class="card-assignees flex -space-x-1"></div>
            </div>
        </div>
    </template>

    <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-[9999]"></div>

    <script src="https://cdn.jsdelivr.net/npm/yjs@13.6.1/dist/yjs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/y-webrtc@13.2.1/dist/y-webrtc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@7.1.1/build/umd.js"></script>
    <script src="db.js"></script>
    <script src="sync.js"></script>
    <script src="dnd.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('ServiceWorker registration successful');
                }).catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
