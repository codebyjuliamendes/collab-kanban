name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t collab-kanban:ci .
      - name: Start container
        run: docker run -d --name kanban -p 3002:3002 --read-only --tmpfs /tmp -v kanban-data:/data collab-kanban:ci
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' kanban)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs kanban
          exit 1
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3002/readyz
          curl -fsS http://127.0.0.1:3002/ | grep -q '<title>Collab Kanban</title>'
          board=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"title":"CI"}' http://127.0.0.1:3002/api/boards)
          id=$(echo "$board" | jq -r .board.id)
          token=$(echo "$board" | jq -r .editorToken)
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"ops":[{"opId":"o1","type":"column.create","id":"todo","title":"Todo"}]}' \
            "http://127.0.0.1:3002/api/boards/$id/ops" | jq -e '.results[0].status == "applied"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/api/boards/$id)" = "401"
      - name: Data survives a restart
        run: |
          set -euo pipefail
          docker restart kanban
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3002/readyz && break; sleep 1; done
          docker run --rm -v kanban-data:/data alpine ls -l /data/kanban.db
      - name: Logs
        if: always()
        run: docker logs kanban || true
