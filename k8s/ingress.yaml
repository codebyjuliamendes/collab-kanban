apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collab-kanban-ingress
  annotations:
    # Keep idle WebSocket connections open (the server pings every 30 s).
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collab-kanban-service
                port:
                  number: 3002
